name: Synchronize releases
on:
  release:
    types: [published, edited, deleted, unpublished, released, prereleased]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
permissions:
  contents: write
concurrency:
  group: release-manifest
  cancel-in-progress: false
jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: npm test
      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm run validate
      - name: Commit a changed manifest
        run: |
          # git diff ignores new files, and git add fails on a path that no longer exists: list what changed.
          changed=$(git status --porcelain --untracked-files=all -- releases.json updater | cut -c4-)
          if [ -z "$changed" ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- $changed
          git commit -m 'Update release manifest'
          git push origin HEAD:main
